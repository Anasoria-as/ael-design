        label: Español
        widget: string
      - name: en
        label: English
        widget: string
    - name: items
      label: Herramientas del grupo
      widget: list
      required: false
      hint: Una por línea.
  - name: about
    label: Sobre mí
    widget: object
    collapsed: true
    fields:
    - name: photo
      label: Tu foto
      widget: image
      required: false
      media_folder: /assets/img
      public_folder: /assets/img
      hint: Sale redonda en Sobre mí. Si la dejas vacía, sale el logo.
    - name: title
      label: Título del texto
      widget: object
      collapsed: false
      fields:
      - name: es
        label: Español
        widget: string
        required: false
      - name: en
        label: English
        widget: string
        required: false
      hint: 'Sale en grande encima del texto. Ejemplo: Just another creative human'
    - name: paragraphs
      label: Párrafos
      widget: object
      fields:
      - name: es
        label: Español
        widget: list
        required: false
        label_singular: párrafo
        field:
          name: item
          label: párrafo
          widget: text
      - name: en
        label: English
        widget: list
        required: false
        label_singular: párrafo
        field:
          name: item
          label: párrafo
          widget: text
      hint: Escribe **así** las palabras que quieras en negrita.
    - name: quote
      label: Frase destacada
