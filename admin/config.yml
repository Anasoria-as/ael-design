    label: CV en PDF
    widget: object
    collapsed: false
    hint: Sube el PDF nuevo aquí. Se guarda en la carpeta cv/.
    fields:
    - name: es
      label: CV en español
      widget: file
      accept: application/pdf
      media_folder: /cv
      public_folder: /cv
      choose_url: false
    - name: en
      label: CV en inglés
      widget: file
      accept: application/pdf
      media_folder: /cv
      public_folder: /cv
      choose_url: false
