      widget: object
      collapsed: false
      fields:
      - name: es
        label: Español
        widget: string
        required: false
      - name: en
        label: English
        widget: string
        required: false
    - name: value
      label: Cifra
      widget: object
      collapsed: false
      fields:
      - name: es
        label: Español
        widget: string
      - name: en
        label: English
        widget: string
    - name: text
      label: Frase de abajo
      widget: object
      collapsed: false
      fields:
      - name: es
        label: Español
        widget: text
        required: false
      - name: en
        label: English
        widget: text
        required: false
  - name: strengths
