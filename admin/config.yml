# =========================================================
#  ael-design · configuración del panel (Sveltia CMS)
#  El panel está en https://anasoriaael.com/admin/
#  Edita content/projects.json y content/site.json sin tocar código.
#  Cada vez que guardas en el panel se hace un commit en GitHub
#  y GitHub Pages publica el cambio en uno o dos minutos.
# =========================================================

backend:
  name: github
  repo: Anasoria-as/ael-design
  branch: main
  auth_methods:
  - token
  commit_messages:
    create: Crear {{collection}} desde el panel
    update: Actualizar {{collection}} desde el panel
    delete: Borrar {{collection}} desde el panel
    uploadMedia: Subir {{path}} desde el panel
    deleteMedia: Borrar {{path}} desde el panel
app_title: ael-design · Panel
site_url: https://anasoriaael.com
logo:
  src: /assets/img/logo-ael.svg
media_folder: assets/img/proyectos
public_folder: /assets/img/proyectos
editor:
  preview: false
output:
  omit_empty_optional_fields: true
singletons:
- name: proyectos
  label: Proyectos
  icon: photo_library
  file: content/projects.json
  format: json
  fields:
  - name: projects
    label: Proyectos
    widget: list
    root: true
    label_singular: proyecto
    collapsed: true
    summary: '{{fields.title.es}}'
    thumbnail: cover
    hint: El orden de la lista es el orden en la web (el destacado siempre va primero).
    fields:
    - name: title
      label: Título
      widget: object
      collapsed: false
      fields:
      - name: es
        label: Español
        widget: string
      - name: en
        label: English
        widget: string
    - name: slug
      label: Identificador
      widget: string
      pattern:
      - ^[a-z0-9-]+$
      - Solo minúsculas, números y guiones, sin espacios.
      hint: Va en el enlace del proyecto (anasoriaael.com/#p-identificador). Si lo cambias, cambia el
        enlace.
    - name: featured
      label: Destacado
      widget: boolean
      required: false
      default: false
      hint: Sale el primero de la lista. Marca solo uno.
    - name: kind
      label: Tipo de proyecto
      widget: object
      collapsed: false
      fields:
      - name: es
        label: Español
        widget: string
        required: false
      - name: en
        label: English
        widget: string
        required: false
      hint: 'Sale en rosa bajo el título de la tarjeta. Ejemplo: Diseño web · UX/UI'
    - name: summary
      label: Resumen
      widget: object
      collapsed: false
      fields:
      - name: es
        label: Español
        widget: text
        required: false
      - name: en
        label: English
        widget: text
        required: false
      hint: Sale al principio de la página del caso.
    - name: cover
      label: Imagen de portada
      widget: image
      required: false
      hint: Unos 1600 × 1000 px. Si la dejas vacía, sale una portada de color con una palabra.
    - name: art
      label: Color de la portada sin imagen
      widget: select
      required: false
      default: yellow
      options:
      - label: Amarillo
        value: yellow
      - label: Magenta
        value: magenta
      - label: Negro
        value: black
      - label: Blanco
        value: white
    - name: art_word
      label: Palabra de la portada sin imagen
      widget: string
      required: false
      hint: Si lo dejas vacío, se usa el identificador.
    - name: gallery
      label: Galería
      widget: list
      required: false
      label_singular: imagen
      hint: Imágenes extra que salen al final del caso.
      field:
        name: image
        label: Imagen
        widget: image
    - name: link
      label: Enlace a la web publicada
      widget: string
      required: false
      hint: Déjalo vacío si no hay web que enseñar.
    - name: year
      label: Año
      widget: string
      required: false
    - name: client
      label: Cliente
      widget: object
      collapsed: false
      fields:
      - name: es
        label: Español
        widget: string
        required: false
      - name: en
        label: English
        widget: string
        required: false
    - name: role
      label: Mi rol
      widget: object
      collapsed: false
      fields:
      - name: es
        label: Español
        widget: string
        required: false
      - name: en
        label: English
        widget: string
        required: false
    - name: tools
      label: Herramientas
      widget: list
      required: false
      hint: Una por línea. Salen en la ficha del caso.
    - name: tags
      label: Etiquetas
      widget: list
      required: false
      hint: Una por línea. Ahora mismo no se muestran en la web.
    - name: sections
      label: Secciones del caso
      widget: list
      required: false
      collapsed: true
      label_singular: sección
      summary: '{{fields.title.es}}'
      hint: Cada sección lleva un texto o una lista. Si rellenas la lista, se muestra la lista.
      fields:
      - name: title
        label: Título de la sección
        widget: object
        collapsed: false
        fields:
        - name: es
          label: Español
          widget: string
        - name: en
          label: English
          widget: string
      - name: text
        label: Texto
        widget: object
        collapsed: false
        fields:
        - name: es
          label: Español
          widget: text
          required: false
        - name: en
          label: English
          widget: text
          required: false
      - name: list
        label: Lista
        widget: object
        fields:
        - name: es
          label: Español
          widget: list
          required: false
          label_singular: punto
          field:
            name: item
            label: punto
            widget: text
        - name: en
          label: English
          widget: list
          required: false
          label_singular: punto
          field:
            name: item
            label: punto
            widget: text
- name: textos
