<script>
  /* Aplica el idioma guardado antes de pintar, para evitar parpadeos */
  (function () {
    var d = document.documentElement;
    var l = null;
    try {
      l = localStorage.getItem('ael-lang');
    } catch (e) {}
    if (l !== 'es' && l !== 'en') l = /^es/i.test(navigator.language || 'es') ? 'es' : 'en';
    d.setAttribute('lang', l);
  })();
</script>
<script>
  /* Contador de visitas: Cloudflare Web Analytics (sin cookies ni datos personales).
     Las visitas de Ana no cuentan: anasoriaael.com/?soy-ana marca este dispositivo
     y anasoriaael.com/?no-soy-ana lo desmarca. */
  (function () {
    var TOKEN = '99f17e9b26ac4660b8db816873d00c22';   // token de Cloudflare → Web Analytics (vacío = contador apagado)
    try {
      var q = location.search;
      if (/[?&](no-)?soy-ana\b/.test(q)) {
        if (/[?&]soy-ana\b/.test(q)) localStorage.setItem('ael-soy-ana', '1');
        else localStorage.removeItem('ael-soy-ana');
        history.replaceState(history.state, '', location.pathname + location.hash);
      }
      if (localStorage.getItem('ael-soy-ana')) return;
    } catch (e) {}
    if (!TOKEN || location.hostname.indexOf('anasoriaael.com') === -1) return;
    var s = document.createElement('script');
    s.type = 'module';   // igual que el código que da Cloudflare
    s.src = 'https://static.cloudflareinsights.com/beacon.min.js';
    s.setAttribute('data-cf-beacon', JSON.stringify({ token: TOKEN }));
    document.head.appendChild(s);
  })();
</script>
